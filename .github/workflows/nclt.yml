name: NCLT Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'

jobs:
  amravati:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Amravati
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          BENCH_VALUE: amravati
          BENCH_LABEL: Amravati
        run: node test.js